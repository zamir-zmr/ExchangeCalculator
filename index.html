<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Pro - Golden Smart Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-main: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;
            --bg-cream: #fffdf5;
            --dark-text: #4a3728;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #e67e22;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--dark-text);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: #b5ae4a;
            min-height: 100vh;
            position: relative;
            border: 4px solid var(--gold-main);
            box-sizing: border-box;
        }

        /* HEADER & UI THEME */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 20px;
            align-items: center;
        }

        .icon-btn {
            background: var(--gold-light);
            border: 1px solid var(--gold-main);
            padding: 10px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .header {
            padding: 1px 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--gold-light), #b67e00);
        }

        /* INPUT CARDS */
        .input-section { padding: 5px; }

        .card {
            background: white;
            border: 1px solid #eee;
            border-bottom: 7px solid var(--gold-main);
            border-left: 7px solid var(--gold-main);
            border-top: 2px solid var(--gold-main);
            border-right: 1px solid var(--gold-main);
            border-radius: 18px;
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
            margin-bottom: 5px;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.1);
        }

        .label { 
            font-size: 10px; 
            font-weight: 800; 
            color: var(--gold-dark); 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            display: block; 
        }

        input { 
            width: 100%; 
            border: none; 
            font-size: 22px; 
            font-weight: 800; 
            outline: none; 
            color: var(--dark-text);
        }

        /* RESULT AREA */
        .result-panel {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            margin: 20px;
            padding: 5px;
            border-radius: 20px;
            color: white;
            text-align: center;
            border: 5px solid #ffd700;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        .save-btn {
            width: calc(100% - 40px);
            margin: 0 20px 20px 20px;
            padding: 18px;
            background: linear-gradient(to right, var(--gold-dark), var(--gold-main));
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(170, 119, 28, 0.3);
        }

        /* FULL PAGE HISTORY */
        #historyPage {
            position: fixed;
            top: 0; left: 100%;
            width: 100%; height: 100%;
            background: #f8f9fa;
            z-index: 1000;
            transition: 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }

        #historyPage.active { left: 0; }

        .hist-header {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--gold-light);
            background: #fff;
        }

        .batch-actions {
            padding: 8px 15px;
            background: var(--bg-cream);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .hist-list { flex: 1; padding: 10px; overflow-y: auto; }
        
        /* SUPER COMPRESSED HISTORY CARD */
        .hist-item {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-left: 4px solid var(--gold-main);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hist-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row-check { width: 16px; height: 16px; accent-color: var(--gold-main); cursor: pointer; margin: 0; }

        .hist-time {
            font-size: 10px;
            font-weight: 700;
            color: #888;
            letter-spacing: 0.2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: #f4f6f8;
            padding: 4px;
            border-radius: 6px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 3px 2px;
            border-radius: 5px;
            border: 1px solid #eef0f2;
        }

        .stat-lbl {
            font-size: 8px;
            font-weight: 800;
            color: #7f8c8d;
            text-transform: uppercase;
            line-height: 1;
        }

        .stat-val {
            font-size: 12px;
            font-weight: 800;
            color: var(--dark-text);
            margin-top: 1px;
            line-height: 1.2;
        }

        .stat-val.profit-plus { color: #10b981; }
        .stat-val.profit-minus { color: #ef4444; }

        /* TOAST POPUP */
        .toast {
            display: none;
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 2000;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: white;
        }
    </style>
</head>
<body>

<div id="homePage" class="app-container">
    <div class="top-bar">
        <button class="icon-btn" onclick="openHistory()">📋</button>
        <div style="font-weight: 800; color: var(--gold-dark);">EXCHANGE PRO</div>
        <div style="width: 40px;"></div>
    </div>

    <div class="header">
        <h1 style="color: #000; font-weight: 700; font-size: 30px;">Golden Dashboard</h1>
        <p style="color: #000; font-weight: 700; font-size: 12px;">$ To ₹ Conversion</p>
    </div>

    <div class="input-section">
        <div class="card">
            <span class="label">Market Rate (₹)</span>
            <input type="number" id="rate" value="94.05" oninput="calculate()">
        </div>
        <div class="card">
            <span class="label">UPI Amount (₹)</span>
            <input type="number" id="upi" placeholder="0" oninput="calculate()">
        </div>
        <div class="card">
            <span class="label">Binomo Before ($)</span>
            <input type="number" id="binomo_before" placeholder="0">
        </div>
        <div class="card">
            <span class="label">Binomo Now Capital ($)</span>
            <input type="number" id="binomo_now" placeholder="0" oninput="calculate()">
        </div>
    </div>

    <div class="result-panel">
        <span class="label" style="color: white; opacity: 0.8;">Total Settlement</span>
        <div id="result" style="font-size: 30px; font-weight: 800;">₹ 0.00</div>
    </div>

    <button class="save-btn" onclick="saveData()">💾 SAVE SETTLEMENT</button>
</div>

<div id="historyPage">
    <div class="hist-header">
        <button onclick="closeHistory()" style="background:none; border:none; font-size: 24px; color: var(--gold-dark); cursor:pointer;">←</button>
        <h2 style="margin:0; font-size: 18px; color: var(--gold-dark);">Trade History</h2>
    </div>

    <div class="batch-actions">
        <label style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;">
            <input type="checkbox" id="selectAll" onclick="toggleSelectAll()"> All
        </label>
        <button onclick="deleteSelected()" style="background:var(--danger); color:white; border:none; padding:6px 12px; border-radius:8px; font-weight:700; cursor:pointer;">Delete</button>
    </div>

    <div class="hist-list" id="histList"></div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    window.onload = function() {
        const savedData = JSON.parse(localStorage.getItem('lifetimeInputs'));
        if (savedData) {
            document.getElementById('rate').value = savedData.r;
            document.getElementById('upi').value = savedData.u;
            document.getElementById('binomo_now').value = savedData.n;
            document.getElementById('binomo_before').value = savedData.b;
            calculate();
        }
    };

    window.onpopstate = function() { closeHistory(); };

    function showToast(msg, color) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.backgroundColor = color;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function calculate() {
        const r = parseFloat(document.getElementById('rate').value) || 0;
        const u = parseFloat(document.getElementById('upi').value) || 0;
        const n = parseFloat(document.getElementById('binomo_now').value) || 0;
        const b = parseFloat(document.getElementById('binomo_before').value) || 0;
        const total = u + (n * r);
        document.getElementById('result').innerText = "₹ " + total.toLocaleString('en-IN', {minimumFractionDigits: 2});

        const inputs = { r: r, u: u, n: n, b: b };
        localStorage.setItem('lifetimeInputs', JSON.stringify(inputs));
    }

    function saveData() {
        const b = parseFloat(document.getElementById('binomo_before').value) || 0;
        const n = parseFloat(document.getElementById('binomo_now').value) || 0;
        const profit = (n - b).toFixed(2);

        let history = JSON.parse(localStorage.getItem('goldHistory') || '[]');

        if (history.length > 0 && history[0].now === n && history[0].before === b) {
            showToast("Already Saved! ⚠️", "#e67e22");
            return;
        }

        history.unshift({ 
            time: new Date().toLocaleString(), 
            now: n.toFixed(2),
            before: b.toFixed(2),
            profit: profit 
        });
        localStorage.setItem('goldHistory', JSON.stringify(history));
        showToast("Record Saved! ✅", "#2d3436");
        renderHistory();
    }

    function openHistory() {
        document.getElementById('historyPage').classList.add('active');
        window.history.pushState({page: "history"}, "History");
        renderHistory();
    }

    function closeHistory() {
        document.getElementById('historyPage').classList.remove('active');
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('goldHistory') || '[]');
        const container = document.getElementById('histList');
        container.innerHTML = history.length ? '' : '<p style="text-align:center;color:#999;margin-top:20px;">No History Found</p>';

        history.forEach((item, index) => {
            const nowVal = item.now !== undefined ? item.now : '0.00';
            const beforeVal = item.before !== undefined ? item.before : '0.00';
            const pVal = parseFloat(item.profit);
            const profitSign = pVal >= 0 ? '+' : '';
            const profitClass = pVal >= 0 ? 'profit-plus' : 'profit-minus';

            container.innerHTML += `
                <div class="hist-item">
                    <div class="hist-top-row">
                        <input type="checkbox" class="row-check" data-index="${index}">
                        <div class="hist-time">⏱ ${item.time}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-lbl">Before</span>
                            <span class="stat-val">$${beforeVal}</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-lbl">Now</span>
                            <span class="stat-val">$${nowVal}</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-lbl">Profit</span>
                            <span class="stat-val ${profitClass}">${profitSign}$${item.profit}</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    function toggleSelectAll() {
        const master = document.getElementById('selectAll');
        document.querySelectorAll('.row-check').forEach(c => c.checked = master.checked);
    }

    function deleteSelected() {
        let history = JSON.parse(localStorage.getItem('goldHistory') || '[]');
        const checks = document.querySelectorAll('.row-check:checked');
        if(!checks.length) return;
        
        const indexes = Array.from(checks).map(c => parseInt(c.getAttribute('data-index'))).sort((a,b) => b-a);
        indexes.forEach(idx => history.splice(idx, 1));
        localStorage.setItem('goldHistory', JSON.stringify(history));
        document.getElementById('selectAll').checked = false;
        renderHistory();
        showToast("Deleted! 🗑️", "#ef4444");
    }
</script>
</body>
</html>
