<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Pro - Golden Smart Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-main: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #aa771c;
            --bg-cream: #fffdf5;
            --dark-text: #4a3728;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #e67e22;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--dark-text);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: white;
            min-height: 100vh;
            position: relative;
            border: 4px solid var(--gold-main);
            box-sizing: border-box;
        }

        /* HEADER & UI THEME */
        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 20px;
            align-items: center;
        }

        .icon-btn {
            background: var(--gold-light);
            border: 1px solid var(--gold-main);
            padding: 10px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .header {
            padding: 1px 20px;
            text-align: center;
            background: linear-gradient(135deg, var(--gold-light), ##64f47d);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            background: linear-gradient(to right, var(--gold-dark), var(--gold-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* INPUT CARDS */
        .input-section { padding: 5px; }
        .card {
            background: white;
            border: 1px solid #eee;
            border-bottom: 7px solid var(--gold-main);
            border-left: 7px solid var(--gold-main);
            border-top: 2px solid var(--gold-main);
            border-right:1px solid var(--gold-main);


            border-radius: 18px;
            padding: 15px;
            margin-bottom: 5px;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.1);
        }

        .label { 
            font-size: 10px; 
            font-weight: 800; 
            color: var(--gold-dark); 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            display: block; 
        }

        input { 
            width: 100%; 
            border: none; 
            font-size: 22px; 
            font-weight: 800; 
            outline: none; 
            color: var(--dark-text);
        }

        /* RESULT AREA */
        .result-panel {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            margin: 20px;
            padding: 5px;
            border-radius: 20px;
            color: white;
            text-align: center;
            border: 5px solid #ffd700;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        .save-btn {
            width: calc(100% - 40px);
            margin: 0 20px 20px 20px;
            padding: 18px;
            background: linear-gradient(to right, var(--gold-dark), var(--gold-main));
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(170, 119, 28, 0.3);
        }

        /* FULL PAGE HISTORY */
        #historyPage {
            position: fixed;
            top: 0; left: 100%;
            width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            transition: 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }

        #historyPage.active { left: 0; }

        .hist-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid var(--gold-light);
            background: #fff;
        }

        .batch-actions {
            padding: 12px 20px;
            background: var(--bg-cream);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .hist-list { flex: 1; padding: 10px 20px; overflow-y: auto; }
        
        .hist-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .row-check { width: 20px; height: 20px; margin-right: 15px; accent-color: var(--gold-main); }
        .profit-val { font-weight: 800; color: var(--success); font-size: 16px; }

        /* TOAST POPUP */
        .toast {
            display: none;
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 50px;
            z-index: 2000;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: white;
        }
    </style>
</head>
<body>

<div id="homePage" class="app-container">
    <div class="top-bar">
        <button class="icon-btn" onclick="openHistory()">📋</button>
        <div style="font-weight: 800; color: var(--gold-dark);">EXCHANGE PRO</div>
        <div style="width: 40px;"></div>
    </div>

    <div class="header">
        <h1>Golden Dashboard</h1>
        <p style="color: var(--gold-dark); font-weight: 700; font-size: 12px;">$ To ₹ Conversion</p>
    </div>

    <div class="input-section">
        <div class="card">
            <span class="label">Market Rate (₹)</span>
            <input type="number" id="rate" value="94.05" oninput="calculate()">
        </div>
        <div class="card">
            <span class="label">UPI Amount (₹)</span>
            <input type="number" id="upi" placeholder="0" oninput="calculate()">
        </div>
        <div class="card">
            <span class="label">Binomo Before ($)</span>
            <input type="number" id="binomo_before" placeholder="0">
        </div>
        <div class="card">
            <span class="label">Binomo Now Capital ($)</span>
            <input type="number" id="binomo_now" placeholder="0" oninput="calculate()">
        </div>
    </div>

    <div class="result-panel">
        <span class="label" style="color: white; opacity: 0.8;">Total Settlement</span>
        <div id="result" style="font-size: 30px; font-weight: 800;">₹ 0.00</div>
    </div>

    <button class="save-btn" onclick="saveData()">💾 SAVE SETTLEMENT</button>
</div>

<div id="historyPage">
    <div class="hist-header">
        <button onclick="closeHistory()" style="background:none; border:none; font-size: 24px; color: var(--gold-dark); cursor:pointer;">←</button>
        <h2 style="margin:0; font-size: 18px; color: var(--gold-dark);">Trade History</h2>
    </div>

    <div class="batch-actions">
        <label style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;">
            <input type="checkbox" id="selectAll" onclick="toggleSelectAll()"> All
        </label>
        <button onclick="deleteSelected()" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:10px; font-weight:700; cursor:pointer;">Delete</button>
    </div>

    <div class="hist-list" id="histList"></div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    window.onpopstate = function() { closeHistory(); };

    function showToast(msg, color) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.backgroundColor = color;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function calculate() {
        const r = parseFloat(document.getElementById('rate').value) || 0;
        const u = parseFloat(document.getElementById('upi').value) || 0;
        const n = parseFloat(document.getElementById('binomo_now').value) || 0;
        const total = u + (n * r);
        document.getElementById('result').innerText = "₹ " + total.toLocaleString('en-IN', {minimumFractionDigits: 2});
    }

    function saveData() {
        const b = parseFloat(document.getElementById('binomo_before').value) || 0;
        const n = parseFloat(document.getElementById('binomo_now').value) || 0;
        const profit = (n - b).toFixed(2);

        let history = JSON.parse(localStorage.getItem('goldHistory') || '[]');

        // SMART LOGIC: Duplicate Prevention
        if (history.length > 0 && history[0].profit === profit) {
            showToast("Already Saved! ⚠️", "#e67e22");
            return;
        }

        history.unshift({ time: new Date().toLocaleString(), profit: profit });
        localStorage.setItem('goldHistory', JSON.stringify(history));
        showToast("Record Saved! ✅", "#2d3436");
        renderHistory();
    }

    function openHistory() {
        document.getElementById('historyPage').classList.add('active');
        window.history.pushState({page: "history"}, "History");
        renderHistory();
    }

    function closeHistory() {
        document.getElementById('historyPage').classList.remove('active');
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('goldHistory') || '[]');
        const container = document.getElementById('histList');
        container.innerHTML = history.length ? '' : '<p style="text-align:center;color:#999;">No History</p>';

        history.forEach((item, index) => {
            container.innerHTML += `
                <div class="hist-item">
                    <input type="checkbox" class="row-check" data-index="${index}">
                    <div style="flex:1">
                        <div style="font-size:11px;color:#999">${item.time}</div>
                        <div class="profit-val">Profit: +$${item.profit}</div>
                    </div>
                </div>`;
        });
    }

    function toggleSelectAll() {
        const master = document.getElementById('selectAll');
        document.querySelectorAll('.row-check').forEach(c => c.checked = master.checked);
    }

    function deleteSelected() {
        let history = JSON.parse(localStorage.getItem('goldHistory') || '[]');
        const checks = document.querySelectorAll('.row-check:checked');
        if(!checks.length) return;
        
        const indexes = Array.from(checks).map(c => parseInt(c.getAttribute('data-index'))).sort((a,b) => b-a);
        indexes.forEach(idx => history.splice(idx, 1));
        localStorage.setItem('goldHistory', JSON.stringify(history));
        document.getElementById('selectAll').checked = false;
        renderHistory();
        showToast("Deleted! 🗑️", "#ef4444");
    }
</script>
</body>
</html>
